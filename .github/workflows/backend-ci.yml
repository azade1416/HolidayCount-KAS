name: Backend CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Solution.slnx

      - name: Build
        run: dotnet build Solution.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Solution.slnx --configuration Release --no-build --no-restore --verbosity minimal
