server {
    listen 8080;
    root /usr/share/nginx/html;

    # Compress text files: smaller downloads, faster first load.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every file name under /assets,
    # so the browser can keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A real robots.txt instead of the React page.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # React Router: unknown paths (e.g. /employee after a refresh) get index.html.
    location / {
        try_files $uri /index.html;
    }
}
