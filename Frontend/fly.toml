# Fly.io config for the React client. Deploy from this folder with: fly deploy
app = 'holidaycount-client'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[build.args]
  VITE_API_URL = 'https://holidaycount-api.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
